# LiteLLM settings shared by every gateway and the admin service. Models, teams and keys are not here: Terraform puts
# them in the database (terraform/config).
model_list: []

litellm_settings:
  callbacks: [usage.usage]
  turn_off_message_logging: true   # prompts and answers never go to a logging callback
  global_disable_no_log_param: true # a caller cannot opt out of the usage record
  drop_params: true
  json_logs: true
  request_timeout: 600
  cache: true                      # Redis for limits and cooldowns only:
  cache_params:
    type: redis
    supported_call_types: []       # answers are never cached

router_settings:
  routing_strategy: simple-shuffle # inside one order level; order decides the location
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 120
  # without these a location that hangs is never taken out, and every call waits for it; 0 takes it out after one
  allowed_fails_policy: {TimeoutErrorAllowedFails: 0, InternalServerErrorAllowedFails: 1, RateLimitErrorAllowedFails: 1}
  retry_policy: {TimeoutErrorRetries: 0, InternalServerErrorRetries: 1, RateLimitErrorRetries: 0}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 5 # per instance; see the README before raising it
  store_model_in_db: true
  proxy_batch_write_at: 10
  allow_requests_on_db_unavailable: false # a key that cannot be checked is refused
  disable_error_logs: true         # error rows can hold request content

guardrails:
  - guardrail_name: model-armor
    litellm_params:
      guardrail: model_armor
      mode: [pre_call, post_call]
      template_id: os.environ/ARMOR_TEMPLATE
      project_id: os.environ/ARMOR_PROJECT
      location: os.environ/ARMOR_LOCATION
      default_on: true
      fail_on_error: true          # no check, no call
