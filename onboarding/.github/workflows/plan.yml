# Every pull request: the settings against every rule, offline (no cloud access). A broken rule fails, with every reason.
name: plan
on:
  pull_request:
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: org
      - name: The pinned release
        id: version
        run: |
          v="$(tr -d '[:space:]' < org/GATEWAY_VERSION)"
          for f in org/.github/workflows/deploy.yml; do
            grep -q "deploy.yml@$v" "$f" && grep -q "version: $v" "$f" || { echo "::error::$f does not use $v (GATEWAY_VERSION)"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fluxorsoft/llm-gateway
          ref: ${{ steps.version.outputs.version }}
          path: gw
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: The settings' rules
        run: |
          terraform -chdir=gw/core/settings init -backend=false -input=false > /dev/null
          terraform -chdir=gw/core/settings plan -input=false -no-color -var dir=../../../org/settings > plan.txt 2>&1 || { cat plan.txt; exit 1; }
          grep -A3 "Warning" plan.txt || true
          echo "The settings follow every rule." >> "$GITHUB_STEP_SUMMARY"
