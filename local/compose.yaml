# A gateway on your own machine, with pretend models: docker compose up -d
#   admin   http://127.0.0.1:4000/ui/   user admin, password sk-local-admin
#   gateway http://127.0.0.1:4001       what apps call, behind the request filter
name: llm-gateway-local
x-litellm: &litellm
  image: ghcr.io/fluxorsoft/llm-gateway/gateway:1.0.0
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ./config.yaml:/etc/litellm/config.yaml:ro
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: local, POSTGRES_DB: litellm}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30}
  admin:
    <<: *litellm
    ports: ["127.0.0.1:4000:8080"]
    environment: &env
      DATABASE_URL: postgresql://postgres:local@db:5432/litellm
      LITELLM_MASTER_KEY: sk-local-admin
      LITELLM_SALT_KEY: sk-local-salt
      DISABLE_SCHEMA_UPDATE: "false"
      GATEWAY_ROLE: admin
  gateway:
    <<: *litellm
    ports: ["127.0.0.1:4001:8080"]
    depends_on:
      admin:
        condition: service_started
    environment:
      <<: *env
      GATEWAY_ROLE: gateway
      DISABLE_SCHEMA_UPDATE: "true"
