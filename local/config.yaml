# Pretend models: they answer with fixed text, cost nothing and need no account. Swap mock_response for a real model later.
model_list:
  - model_name: orders-fast
    litellm_params:
      model: openai/pretend-a
      api_key: none
      mock_response: "Pretend model A says hello from the first place."
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002
      order: 1
  - model_name: support-chat
    litellm_params:
      model: openai/pretend-b
      api_key: none
      mock_response: "Pretend model B says hello from the second place."
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0002

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5
