# Started by hand. Keyless: GitHub's identity is exchanged for a short-lived Google one, only in the gateway environment.
#
# plan      the images, and what step 1 would change
# apply     images, step 1 (platform), step 2 (LiteLLM settings, in the VPC), the example apps, then the checks
# settings  a change of settings only: the runner image, step 1 (team projects), step 2
# checks    the checks alone
# upgrade   the upgrade lane: new images to the migration, the admin service and one region; the key probe; the settings;
#           the checks of the teams served there; then every region, and every team's checks
# destroy   everything apply made
name: deploy
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply, settings, checks, upgrade, destroy]
        default: plan
permissions:
  contents: read
  id-token: write
concurrency:
  group: gateway
  cancel-in-progress: false
env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  NAME: llmgw
  REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
  REPO_LOCATION: europe
  SETTINGS_DIR: ${{ vars.SETTINGS_DIR || 'settings/example' }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: gateway
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PROVIDER }}
          service_account: ${{ vars.GCP_IDENTITY }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: The example's project ids
        if: vars.EXAMPLE_PROJECTS != ''
        env:
          PROJECTS: ${{ vars.EXAMPLE_PROJECTS }} # JSON: {"orders-project-id": "...", "support-project-id": "..."}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$PROJECTS" | while read -r from to; do
            sed -i "s/$from/$to/" settings/example/teams/*.yaml
          done

      - name: Variables
        env:
          PLATFORM_TFVARS: ${{ vars.PLATFORM_TFVARS || '{}' }}
        run: |
          gcloud auth configure-docker "$REPO_LOCATION-docker.pkg.dev" --quiet
          none="none@sha256:$(printf '0%.0s' $(seq 64))"
          jq --arg p "$PROJECT" --arg d "../../../$SETTINGS_DIR" --arg n "$none" \
            '. + {project: $p, settings_dir: $d, images: {gateway: $n, runner: $n, app: $n}}' <<< "$PLATFORM_TFVARS" > clouds/gcp/platform/ci.auto.tfvars.json
          terraform -chdir=clouds/gcp/platform init -no-color -backend-config="bucket=$PROJECT-$NAME-tfstate" -backend-config=prefix=platform > /dev/null
          terraform -chdir=clouds/gcp/apps init -no-color -backend-config="bucket=$PROJECT-$NAME-tfstate" -backend-config=prefix=apps > /dev/null

      - name: Verify, build and push the images
        if: contains(fromJSON('["plan", "apply", "settings", "upgrade"]'), inputs.action)
        run: |
          export REPO="$REPO_LOCATION-docker.pkg.dev/$PROJECT/$NAME"
          if [ "${{ inputs.action }}" = settings ]; then # the gateways and apps stay as they are
            KEEP="$(terraform -chdir=clouds/gcp/platform output -json images)" && export KEEP ONLY=runner
          fi
          images="$(scripts/images.sh)"
          echo "$images" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          jq --argjson i "$images" '.images = $i' clouds/gcp/platform/ci.auto.tfvars.json > t && mv t clouds/gcp/platform/ci.auto.tfvars.json

      - name: Step 1, plan
        if: contains(fromJSON('["plan", "apply", "settings"]'), inputs.action)
        run: |
          terraform -chdir=clouds/gcp/platform plan -no-color -out=p.tfplan > /tmp/plan.txt || { tail -40 /tmp/plan.txt; exit 1; }
          grep -E '^  # |^Plan|^No changes' /tmp/plan.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Step 1, apply
        if: contains(fromJSON('["apply", "settings"]'), inputs.action)
        run: terraform -chdir=clouds/gcp/platform apply -no-color p.tfplan

      - name: Step 2, LiteLLM settings
        if: contains(fromJSON('["apply", "settings"]'), inputs.action)
        run: gcloud run jobs execute "$NAME-config" --project="$PROJECT" --region="$REGION" --update-env-vars=MODE=apply --wait

      - name: The example apps
        if: inputs.action == 'apply'
        env:
          MEMBERS: ${{ vars.APP_MEMBERS || '[]' }}
        run: |
          terraform -chdir=clouds/gcp/platform output -json > /tmp/out.json
          IMAGE="$(jq -r .images.app clouds/gcp/platform/ci.auto.tfvars.json)" clouds/gcp/scripts/app_vars.sh < /tmp/out.json > clouds/gcp/apps/ci.auto.tfvars.json
          terraform -chdir=clouds/gcp/apps apply -auto-approve -no-color

      - name: Checks, as each team
        if: contains(fromJSON('["apply", "checks"]'), inputs.action)
        run: |
          terraform -chdir=clouds/gcp/platform output -json teams | jq -r 'to_entries[] | "\(.key) \(.value.project) \(.value.region)"' | while read -r team project region; do
            gcloud run jobs execute "$team-check" --project="$project" --region="$region" --wait < /dev/null
          done

      - name: Cost reports
        if: contains(fromJSON('["apply", "checks"]'), inputs.action) && vars.USAGE_BIGQUERY != 'false'
        run: |
          dataset="$PROJECT.$(echo "$NAME" | tr - _)_usage"
          for f in docs/reports/*.sql; do
            sed "s/{{dataset}}/$dataset/g" "$f" | bq query --project_id="$PROJECT" --use_legacy_sql=false --quiet > /dev/null               || echo "::warning::$(basename "$f" .sql) not made yet: its columns appear after the first matching call"
          done

      - name: Upgrade lane, 1 of 2 (one region first)
        if: inputs.action == 'upgrade'
        run: |
          P=clouds/gcp/platform
          now="$(terraform -chdir=$P output -json images)"
          region="$(terraform -chdir=$P output -raw canary_region)"
          [ -n "$region" ] && [ "$region" != null ] || { echo "::error::the lane needs two gateway regions"; exit 1; }
          cp $P/ci.auto.tfvars.json new.json # every new image, for step 2
          new="$(jq -r .images.gateway new.json)"
          jq --argjson now "$now" --arg r "$region" --arg g "$new" \
            '.canary = {region: $r, gateway: $g} | .images.gateway = $now.gateway | .images.app = $now.app' \
            $P/ci.auto.tfvars.json > lane.json
          cp lane.json $P/ci.auto.tfvars.json
          terraform -chdir=$P apply -no-color -auto-approve
          gcloud run jobs execute "$NAME-config" --project="$PROJECT" --region="$REGION" --update-env-vars=MODE=probe --wait
          gcloud run jobs execute "$NAME-config" --project="$PROJECT" --region="$REGION" --update-env-vars=MODE=apply --wait
          terraform -chdir=$P output -json teams | jq -r --arg r "$region" 'to_entries[] | select(.value.region == $r) | "\(.key) \(.value.project) \(.value.region)"' | while read -r team project where; do
            gcloud run jobs execute "$team-check" --project="$project" --region="$where" --wait < /dev/null
          done
          echo "region=$region" >> "$GITHUB_STEP_SUMMARY"

      - name: Upgrade lane, 2 of 2 (every region, every team)
        if: inputs.action == 'upgrade'
        run: |
          P=clouds/gcp/platform
          cp new.json $P/ci.auto.tfvars.json
          terraform -chdir=$P apply -no-color -auto-approve
          terraform -chdir=$P output -json teams | jq -r 'to_entries[] | "\(.key) \(.value.project) \(.value.region)"' | while read -r team project where; do
            gcloud run jobs execute "$team-check" --project="$project" --region="$where" --wait < /dev/null
          done

      - name: Destroy
        if: inputs.action == 'destroy'
        run: |
          gcloud run jobs execute "$NAME-config" --project="$PROJECT" --region="$REGION" --update-env-vars=MODE=destroy --wait ||
            echo "::warning::step 2 was not destroyed; its database goes with step 1"
          terraform -chdir=clouds/gcp/platform output -json > /tmp/out.json
          IMAGE=none clouds/gcp/scripts/app_vars.sh < /tmp/out.json > clouds/gcp/apps/ci.auto.tfvars.json || true
          terraform -chdir=clouds/gcp/apps destroy -auto-approve -no-color
          terraform -chdir=clouds/gcp/platform destroy -auto-approve -no-color
