# On a v* tag: the three images to GHCR, signed (keyless), and the onedoorai package to PyPI (trusted publishing,
# from the pypi environment: no token). Needs no cloud access.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verify, build, push
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}" scripts/images.sh > images.json
          jq . images.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The gateway image holds no Enterprise parts
        run: |
          id="$(docker create "$(jq -r .gateway images.json)")"
          docker export "$id" | tar -t > files.txt
          ! grep -iE "litellm_enterprise|^app/enterprise/" files.txt
      - name: Tag and sign
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in gateway runner app; do
            ref="$(jq -r ".$i" images.json)"
            docker buildx imagetools create -t "${ref%@*}:$version" "$ref"
            cosign sign --yes "$ref"
          done

  package:
    # the onedoorai package: built and checked here, with no publishing rights
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag and the package agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/onedoorai/__init__.py)"
          [ "$tag" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME, but onedoorai's version is $version"; exit 1; }
      - name: Build
        run: |
          python3 -m pip install -q build==1.3.0 twine==6.2.0
          python3 -m build --outdir dist .
          python3 -m twine check --strict dist/*
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onedoorai
          path: dist/
          if-no-files-found: error

  pypi:
    # PyPI's trusted publishing: no token; PyPI trusts this repository's publish.yml in the pypi environment
    needs: [publish, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onedoorai
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
