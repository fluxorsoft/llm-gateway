# Every change: the filter's tests, the settings' rules, and valid Terraform. No cloud access.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: The request filter
        run: |
          python3 -m pip install -q pyyaml==6.0.2
          python3 -m unittest discover -s gateways/litellm/gateway/tests
      - name: The key step
        run: python3 -m unittest discover -s tests
      - name: The onedoorai package builds, installs and runs
        run: |
          python3 -m pip install -q build==1.2.2.post1
          python3 -m build --wheel --outdir dist . > build.txt || { cat build.txt; exit 1; }
          python3 -m venv /tmp/w && /tmp/w/bin/pip install -q dist/onedoorai-*.whl
          /tmp/w/bin/onedoorai --version
          ! /tmp/w/bin/onedoorai admin 2> err.txt && grep -q "address is needed" err.txt
      - name: Python and shell are well formed
        run: |
          python3 -m compileall -q src gateways apps
          bash -n scripts/*.sh clouds/gcp/scripts/*.sh && sh -n gateways/litellm/runner/run.sh
      - name: Terraform is formatted and valid
        run: |
          terraform fmt -check -recursive core clouds gateways
          for d in core/settings clouds/gcp/team clouds/gcp/platform gateways/litellm/config clouds/gcp/apps; do
            terraform -chdir=$d init -backend=false -input=false > /dev/null
            terraform -chdir=$d validate -no-color
          done
      - name: The settings' rules
        run: terraform -chdir=core/settings test -no-color
      - name: The example settings pass
        run: terraform -chdir=core/settings plan -input=false -no-color -var dir=../../settings/example > /dev/null
      - name: The onboarding template's settings pass (schema 2, no warning)
        run: |
          terraform -chdir=core/settings plan -input=false -no-color -var dir=../../onboarding/settings > tpl.txt 2>&1 || { cat tpl.txt; exit 1; }
          ! grep -q "Warning" tpl.txt || { cat tpl.txt; exit 1; }
      - name: What this version cannot serve is refused, with its reason
        run: |
          ! terraform -chdir=core/settings plan -input=false -no-color -var dir=./testdata/later > later.txt 2>&1
          for w in "schema 3" "cloud 'aws'" "provider 'bedrock'"; do grep -q "$w" later.txt || { cat later.txt; exit 1; }; done

  # the image as it ships, with the real LiteLLM, pretend models and a pretend Model Armor
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify and build
        run: |
          base="$(tr -d '\r\n' < gateways/litellm/LITELLM_IMAGE)"
          cosign verify "$base" \
            --certificate-identity=https://github.com/BerriAI/project-releaser/.github/workflows/release.yml@refs/heads/main \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com > /dev/null
          docker build -q --build-arg "LITELLM_IMAGE=$base" -t gateway:test -f gateways/litellm/gateway/Dockerfile .
      - name: Start
        run: |
          cd gateways/litellm/gateway/tests/integration
          python3 fake_google.py > /dev/null 2>&1 &
          docker run -d --name gateway --network host -v "$PWD/config.yaml:/etc/litellm/config.yaml:ro" \
            -e ARMOR_ENDPOINT=http://127.0.0.1:9100 -e GCE_METADATA_HOST=127.0.0.1:9100 -e GCE_METADATA_IP=127.0.0.1:9100 \
            -e LITELLM_MASTER_KEY=sk-test             -e GATEWAY_SETTINGS='{"litellm_settings": {"request_timeout": 600}}' gateway:test
          docker run -d --name developer --network host -v "$PWD/config.yaml:/etc/litellm/config.yaml:ro"             -e ARMOR_ENDPOINT=http://127.0.0.1:9100 -e GCE_METADATA_HOST=127.0.0.1:9100 -e GCE_METADATA_IP=127.0.0.1:9100             -e LITELLM_MASTER_KEY=sk-test -e GATEWAY_ROLE=developer gateway:test             --config /etc/litellm/config.yaml --port 8081 --num_workers 1
          for p in 8080 8081; do
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:$p/health/liveliness > /dev/null && break; sleep 2; done
            curl -sf http://127.0.0.1:$p/health/liveliness > /dev/null || { docker logs gateway | tail -30; docker logs developer | tail -30; exit 1; }
          done
      - name: Every message, every answer, or no call
        run: GATEWAY=http://127.0.0.1:8080 GOOGLE=http://127.0.0.1:9100 python3 gateways/litellm/gateway/tests/integration/test_gateway.py
      - name: The developers' door
        run: GATEWAY=http://127.0.0.1:8080 DEVELOPER=http://127.0.0.1:8081 GOOGLE=http://127.0.0.1:9100 python3 gateways/litellm/gateway/tests/integration/test_developer_door.py
      - name: What the gateway said
        if: failure()
        run: docker logs gateway | tail -60; docker logs developer | tail -60
